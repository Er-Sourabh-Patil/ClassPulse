
name: Deploy ClassPulse to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classpulse-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: |
          python -m compileall -q \
            app.py config.py database.py analytics.py recommendations.py

      - name: Prepare SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/classpulse_deploy
          chmod 600 ~/.ssh/classpulse_deploy

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Package application
        run: |
          tar -czf /tmp/classpulse-release.tar.gz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='venv' \
            --exclude='.venv' \
            --exclude='instance' \
            --exclude='.env' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            .

      - name: Copy release to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i ~/.ssh/classpulse_deploy \
            /tmp/classpulse-release.tar.gz \
            "$EC2_USER@$EC2_HOST:/tmp/classpulse-release.tar.gz"

      - name: Deploy and restart ClassPulse
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/classpulse_deploy \
            "$EC2_USER@$EC2_HOST" 'bash -s' <<'REMOTE'
          set -eu

          APP_DIR=/var/www/classpulse/ClassPulse

          cd "$APP_DIR"

          # Preserve instance/, venv/, and .env.
          tar -xzf /tmp/classpulse-release.tar.gz \
            --exclude=instance \
            --exclude=venv \
            --exclude=.env \
            -C "$APP_DIR"

          "$APP_DIR/venv/bin/pip" install -r "$APP_DIR/requirements.txt"

          sudo systemctl restart classpulse
          sudo systemctl is-active --quiet classpulse

          # Verify the application responds locally.
          for i in $(seq 1 10); do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/; then
              echo "ClassPulse deployment successful."
              rm -f /tmp/classpulse-release.tar.gz
              exit 0
            fi
            sleep 2
          done

          echo "Application health check failed."
          sudo journalctl -u classpulse -n 50 --no-pager
          exit 1
          REMOTE
